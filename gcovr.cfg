# gcovr configuration file
# Coverage scoped to MCTP source files only

filter = src/mctp/
exclude = src/tests/
# Exclude the daemon entry point from unit coverage: its main() body and the
# lambdas it posts are only reachable through the live event loop, not unit
# tests.
exclude = .*MCTPReactorMain\.cpp$
html = yes
print-summary = yes
decisions = yes
exclude-throw-branches = yes
exclude-unreachable-branches = yes
exclude-function-lines = yes
exclude-noncode-lines = yes
exclude-branches-by-pattern = ^\s*catch\s*\(
